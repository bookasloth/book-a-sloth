# PRIMARY production deployer. Local → push to main → this deploys to Vercel.
#
# On every push to main it runs `vercel deploy --prod` (REMOTE build), which runs
# `vercel-build`: vitest → vite build → prerender, failing the deploy on any error.
# Also runnable by hand from the Actions tab (workflow_dispatch).
#
# NO DOUBLE-DEPLOY RACE: Vercel's own Git integration is disabled for main
# (client/vercel.json → git.deploymentEnabled: { "main": false }), so Vercel does
# NOT auto-deploy production — only this workflow does. Vercel still builds PR
# PREVIEW deployments for other branches, so client regressions surface on PRs.
#
# WHY TOKEN-AUTH (not Vercel's git integration for prod): the Vercel project sits
# on a Hobby team, and the git integration blocks deployments whose commit author
# isn't the team owner ("does not have contributing access"). Token-authenticated
# CLI deploys run AS the owner and bypass that check — so bot/co-author commits
# still ship.
#
# FALLBACK if this workflow can't run — e.g. the Actions spending limit is
# exhausted, jobs refused before checkout ("recent account payments have failed
# or your spending limit needs to be increased"): deploy production by hand.
#   - Vercel dashboard → Deployments → Redeploy the latest main commit, OR
#   - from a machine with the Vercel CLI, at the REPO ROOT (project dir is `client`):
#       npx vercel deploy --prod
#
# REQUIRED SECRET (GitHub repo → Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN — create at vercel.com → Account Settings → Tokens.
# Org/project IDs are not secrets; they are pinned below.

name: Deploy to Vercel (production)

on:
  push:
    branches: [main]
    # Only the CLIENT ships to Vercel. Server-only / docs-only / workflow-only
    # merges (the server deploys separately to Render) skip this ~13-min build
    # entirely — the single biggest Actions-minute saver. A merge that touches
    # both client and server still deploys (client path matched). Manual
    # workflow_dispatch has no path filter, so a forced re-deploy always runs.
    paths:
      - 'client/**'
      # docs/help is the ONE docs directory that ships in the client bundle:
      # client/src/content/helpDocs.js inlines it at build time via
      # import.meta.glob, and the /help/docs/* pages prerender from it. Without
      # this line a help-article-only merge never redeploys, so /help keeps
      # serving the previous text indefinitely while Bolt (reseeded from the
      # same files) moves on. Every other docs/ directory is still skipped.
      - 'docs/help/**'
      - '.github/workflows/deploy-vercel.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to production (false = dry run: build + prerender only, output uploaded as an artifact)'
        type: boolean
        default: true

concurrency:
  group: vercel-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_zIeLwmD7MoWJWDJyb2YEb8IK
  VERCEL_PROJECT_ID: prj_b02XYKuwhxoZakgucihWVXgUdUIA

jobs:
  # Generate OG social cards for any freshly-published blog post BEFORE the deploy.
  # WHY first: the Vercel remote build's prerender HARD-FAILS if a published post
  # has no og_image card (see the blog-OG guard). Blogs are DB-backed, so a card
  # can't be produced at prerender time inside Vercel — Chromium is kept off both
  # Render and Vercel build. This job renders the /og/blog route with Puppeteer
  # here (Actions has Chromium + prod secrets), uploads the PNG, and stamps
  # blogs.og_image. `--missing` only touches posts with no card yet, so a normal
  # deploy with nothing new is a fast no-op. Mirrors host-og-cards.yml.
  blog-og:
    name: Generate blog OG cards (missing only)
    runs-on: ubuntu-latest
    timeout-minutes: 12   # the Chromium apt step is flaky; never let it hang a runner
    if: github.repository == 'bookasloth/book-a-sloth'
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      # Puppeteer's bundled Chromium needs these shared libs on the runner. The
      # `|| true` fallback covers Ubuntu's libasound2 → libasound2t64 rename.
      - name: Chromium system libraries
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk-bridge2.0-0 libcups2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64 \
            || sudo apt-get install -y libasound2

      - name: Ensure Chromium is present
        run: npx puppeteer browsers install chrome

      # The /og/blog route reads all data from query params — no API/Supabase call
      # at render time — so these placeholders are never used; they only satisfy
      # vite.config.js's required-env guard. The dist is screenshotted then discarded.
      #
      # EVERY VITE_* referenced as a %PLACEHOLDER% in index.html must be set here,
      # even when this job never uses the value. An unsubstituted `%VITE_FOO%` left
      # in an href reaches Vite's HTML pass, which calls decodeURI on it and dies
      # with "URI malformed" (`%VI` is not a valid percent escape) — failing this
      # job and skipping the `deploy` job that needs it.
      - name: Build (no prerender)
        run: npm run build:no-prerender
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key-unused-by-og-route
          VITE_API_URL: https://placeholder.invalid/api
          VITE_POSTHOG_HOST: https://placeholder.invalid

      - name: Generate cards for newly-published posts
        run: node scripts/generateBlogOgImages.mjs --missing
        env:
          SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PROD_SUPABASE_SERVICE_ROLE_KEY }}

  # Deploy runs independently of blog-og. OG-card generation is best-effort and
  # must NEVER block a production deploy — its Chromium apt step is flaky and has
  # hung the pipeline. Trade-off: a brand-new blog post may ship one deploy before
  # its OG card is stamped in the DB; the next deploy backfills it.
  # Build HERE, upload the finished output (`vercel build` + `deploy --prebuilt`).
  #
  # WHY: Vercel kills any build at 45 minutes, and the prerender (~300 pages in a
  # headless browser, many waiting on the free-tier API) outgrew it — the
  # 2026-10-10 release timed out twice and shipped nothing. A GitHub job can run
  # for hours; Vercel now only receives static files + the edge middleware.
  #
  # The old reason for building remotely (2026-07-08 white screen): `vercel pull`
  # can't read env vars marked Sensitive, so the bundle built without VITE_* vars.
  # Fixed by passing every VITE_* the client reads straight from GitHub secrets
  # below (they ship inside the public JS bundle anyway — not real secrets), and
  # vite.config.js refuses to build if the required ones are missing, so a missing
  # secret fails this job instead of white-screening prod.
  #
  # Dry run: Actions → this workflow → Run workflow on a branch with deploy=false
  # builds + prerenders exactly like prod and uploads the output as an artifact,
  # without deploying anything.
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # Project settings (root dir = client, framework, build command) + the
      # non-sensitive env vars. Sensitive ones come from secrets in the next step.
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      # Runs the project's build command (`vercel-build`: vite build → prerender).
      # VERCEL_ENV=production is what makes prerender run (it skips non-prod).
      - name: Build + prerender
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_PUBLIC_SITE_URL: ${{ secrets.VITE_PUBLIC_SITE_URL }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
          VITE_POSTHOG_PROJECT_TOKEN: ${{ secrets.VITE_POSTHOG_PROJECT_TOKEN }}
          VITE_GTM_CONTAINER_ID: ${{ secrets.VITE_GTM_CONTAINER_ID }}
          VITE_GA4_MEASUREMENT_ID: ${{ secrets.VITE_GA4_MEASUREMENT_ID }}
          VITE_FB_PIXEL_ID: ${{ secrets.VITE_FB_PIXEL_ID }}
          VITE_CLARITY_PROJECT_ID: ${{ secrets.VITE_CLARITY_PROJECT_ID }}
          # Tells the API's ipGuard this burst is the trusted build runner.
          PRERENDER_BUILD_TOKEN: ${{ secrets.PRERENDER_BUILD_TOKEN }}
          # Same code paths as Vercel's builder: fail-closed blog/host route
          # fetches, @sparticuz/chromium, and prerender only runs for production.
          VERCEL: '1'
          VERCEL_ENV: production
          # No time budget off Vercel's 45-min clock (prerender.mjs default is 30).
          PRERENDER_BUDGET_MS: '6000000'

      # Belt-and-braces against the 2026-07-08 white screen: the built bundle must
      # contain the real API origin, not an unsubstituted %VITE_API_URL% or nothing.
      - name: Verify env baked into the bundle
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          grep -rqF "$VITE_API_URL" .vercel/output/static/assets || { echo "VITE_API_URL not in bundle — refusing to deploy"; exit 1; }
          ! grep -rqF "%VITE_" .vercel/output/static/index.html || { echo "unsubstituted %VITE_*% in index.html"; exit 1; }

      - name: Upload build (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.deploy == false
        uses: actions/upload-artifact@v4
        with:
          name: vercel-output
          path: .vercel/output
          retention-days: 3

      - name: Deploy prebuilt output
        if: github.event_name == 'push' || inputs.deploy == true
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
