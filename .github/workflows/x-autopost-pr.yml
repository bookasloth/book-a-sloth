name: X autopost (merged PRs)

# Posts every merged PR to X (Twitter) as a build-in-public update in brand voice.
# See .github/scripts/x-post-pr.mjs. Part A of the "never post on X manually" setup;
# Part B (keyword search + approval-gated replies) needs X API Basic tier and lives
# on Render, not here.
#
# Fires when a PR MERGES (not just closes). Skips release-train umbrella merges
# (head branch release/*) so a release -> main merge doesn't post a duplicate tweet
# on top of the individual feature PRs it already announced.
# ponytail: base filter is intentionally none — catches PRs into main AND release/*.
# If that ever gets noisy, add a `base` guard.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   X_API_KEY  X_API_SECRET  X_ACCESS_TOKEN  X_ACCESS_SECRET  — X app, Read+Write scope
#   ANTHROPIC_API_KEY  — optional; without it, posts a plain template instead of an AI rewrite
# Without the four X_* secrets the script dry-runs (logs the tweet, posts nothing).

on:
  pull_request:
    types: [closed]

concurrency:
  group: x-autopost-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  post:
    name: Post merged PR to X
    runs-on: ubuntu-latest
    # Only on merge, only this repo (forks lack secrets), skip release-train umbrella PRs.
    if: >
      github.repository == 'bookasloth/book-a-sloth' &&
      github.event.pull_request.merged == true &&
      !startsWith(github.event.pull_request.head.ref, 'release/')
    defaults:
      run:
        working-directory: .github/scripts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install --no-package-lock --no-audit --no-fund

      - name: Post to X
        run: node x-post-pr.mjs
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
