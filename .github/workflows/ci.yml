name: CI

# Runs on every push and PR to main. Gates "does it build + do tests pass", then
# (on push to main only) deploys the client to Vercel from CI via the Vercel CLI.
# This CI deploy is independent of Vercel's GitHub git integration, which silently
# stopped firing on 2026-06-23 and left several merges undeployed (see DEPLOYMENT.md).
# Render (backend) still auto-deploys on push.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run if a newer commit is pushed to the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      # Use `npm install` (not `npm ci`) for the client: `npm ci` trips the npm
      # optional-deps bug (npm/cli#4828) and fails to install rollup's Linux
      # native binary (@rollup/rollup-linux-x64-gnu), crashing `vite build`.
      # `npm install` resolves the platform optional correctly — and matches how
      # Vercel installs on deploy, so CI mirrors production.
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
        env:
          # Build needs VITE_ vars present (values don't matter for a build check).
          VITE_API_URL: http://localhost:5000
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
          VITE_RAZORPAY_KEY_ID: ci-placeholder
      - name: Test
        run: npm test

  server:
    name: Server (unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # Informational dependency audit. Non-blocking (|| true) so a freshly
      # disclosed advisory in a transitive dep doesn't wall off all deploys —
      # Dependabot raises the fix PR; this surfaces high/critical in the log.
      - name: Audit (informational)
        run: npm audit --omit=dev --audit-level=high || true
      - name: Unit tests
        # Only unit tests in CI. Integration tests hit live Supabase/SMTP and
        # need real credentials — run those manually/locally, not in CI.
        run: npm run test:unit
        env:
          NODE_ENV: test
          # Dummy secrets so tests that read process.env don't crash. These are
          # NOT real and grant nothing.
          SUPER_ADMIN_JWT_SECRET: ci-test-secret-not-real
          OAUTH_STATE_SECRET: ci-test-secret-not-real
          GOOGLE_TOKEN_KEY: ci-test-32-byte-key-000000000000
          CLIENT_URL: http://localhost:5173
          AISENSY_WEBHOOK_SECRET: ci-test-secret-not-real

  deploy:
    name: Deploy to Vercel (production)
    runs-on: ubuntu-latest
    needs: [client, server]
    # Only on a real push to main (not PRs), and only after build + tests pass.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Deploys the prebuilt output straight to Vercel via the CLI — INDEPENDENT of
    # Vercel's GitHub git integration (which silently stopped firing 2026-06-23).
    # No-op (stays green) until these three repo secrets are set:
    #   VERCEL_TOKEN      — Vercel > Account Settings > Tokens > Create
    #   VERCEL_ORG_ID     — from .vercel/project.json after `vercel link` (the "orgId")
    #   VERCEL_PROJECT_ID — Vercel > Project > Settings > Project ID (the "projectId")
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Skip if Vercel secrets not configured
        if: env.VERCEL_TOKEN == ''
        run: echo "VERCEL_TOKEN not set — add VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID to repo secrets to enable CI deploys. Skipping (no-op)."
      - uses: actions/checkout@v4
        if: env.VERCEL_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.VERCEL_TOKEN != ''
        with:
          node-version: "22"
      - name: Install Vercel CLI
        if: env.VERCEL_TOKEN != ''
        run: npm i -g vercel@latest
      - name: Pull Vercel project settings + production env
        if: env.VERCEL_TOKEN != ''
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build production output
        if: env.VERCEL_TOKEN != ''
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy prebuilt output to production
        if: env.VERCEL_TOKEN != ''
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
