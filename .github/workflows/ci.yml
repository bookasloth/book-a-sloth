name: CI

# Server unit tests on every push and PR to main.
#
# CI does NOT deploy, and is NOT the deployment gate. Both deploys own their own
# checks, so a green deploy means the checks passed:
#   - Client → deploy-vercel.yml runs `vercel deploy --prod` on push to main (a
#     REMOTE build, so `vercel-build` runs vitest → build → prerender; any failure
#     fails the deploy). Vercel still builds a PREVIEW on every PR, so client
#     regressions surface there before merge.
#   - Server → Render. buildCommand runs `npm run test:unit`; a failing test means
#     the server does not ship. Render is where the server actually deploys, which
#     is the only place a server test can gate a server release.
#
# The old client job here duplicated the Vercel build exactly and was removed:
# it burned Actions minutes to assert something the deploy already asserts. This
# job stays because Render only builds on push to main/staging — it is the one
# place server tests run BEFORE a merge.
#
# Remote builds (whether via deploy-vercel.yml or a PR preview) run inside Vercel
# and can read env vars marked Sensitive, which a CI-side `vercel build --prebuilt`
# cannot — that mismatch caused the 2026-07-08 white-screen outage, so we never
# prebuild client bundles in CI.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run if a newer commit is pushed to the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # Informational dependency audit. Non-blocking (|| true) so a freshly
      # disclosed advisory in a transitive dep doesn't wall off all deploys —
      # Dependabot raises the fix PR; this surfaces high/critical in the log.
      - name: Audit (informational)
        run: npm audit --omit=dev --audit-level=high || true
      - name: Unit tests
        # Only unit tests in CI. Integration tests hit live Supabase/SMTP and
        # need real credentials — run those manually/locally, not in CI.
        run: npm run test:unit
        env:
          NODE_ENV: test
          # Dummy secrets so tests that read process.env don't crash. These are
          # NOT real and grant nothing.
          SUPER_ADMIN_JWT_SECRET: ci-test-secret-not-real
          OAUTH_STATE_SECRET: ci-test-secret-not-real
          GOOGLE_TOKEN_KEY: ci-test-32-byte-key-000000000000
          CLIENT_URL: http://localhost:5173
          AISENSY_WEBHOOK_SECRET: ci-test-secret-not-real
