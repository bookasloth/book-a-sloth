# Automated dependency + GitHub Actions updates.
# Weekly PRs, grouped to keep the noise low. Security advisories are raised
# immediately regardless of this schedule (GitHub's Dependabot alerts).
version: 2
updates:
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      server-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      client-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Stay on React 18. A grouped run still bumped @types/react-dom to 19,
    # which demands @types/react@19 → unresolvable peer conflict that broke the
    # Vercel build. `ignore` is absolute: blocks these majors, grouped or not.
    # Drop these entries when we deliberately migrate to React 19.
    ignore:
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
