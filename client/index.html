<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book A Sloth — booked &amp; paid at 0% commission</title>
    <meta name="description" content="The calm booking + payments platform for India's freelancers, coaches, tutors and studios. Keep what you earn — 0% commission, flat pricing, UPI &amp; GST built in." />
    <meta name="theme-color" content="#FE5100" />
    <link rel="canonical" href="https://bookasloth.com/" />

    <!-- Open Graph / social link previews. NOTE: static (scrapers don't run JS).
         One shared card for all routes; per-LP cards need SSR/prerender.
         TODO: add a 1200x630 og-image.png to client/public/. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Book A Sloth" />
    <meta property="og:title" content="Book A Sloth — booked &amp; paid at 0% commission" />
    <meta property="og:description" content="The calm booking + payments platform for India. Keep what you earn — 0% commission, flat pricing, UPI &amp; GST built in." />
    <meta property="og:url" content="https://bookasloth.com/" />
    <meta property="og:image" content="https://bookasloth.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Book A Sloth — booked &amp; paid at 0% commission" />
    <meta name="twitter:description" content="Keep what you earn — 0% commission, flat pricing, UPI &amp; GST built in. Built for India." />
    <meta name="twitter:image" content="https://bookasloth.com/og-image.png" />
    <!-- Poppins — admin panel font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" />
    <!-- Razorpay Checkout — required for window.Razorpay in onboarding plan purchase -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <!-- Marketing tags (Meta Pixel, GA4, Microsoft Clarity) are loaded by the
         consent-gated analytics bus (src/services/analytics/) ONLY after the user
         grants marketing consent. IDs come from VITE_FB_PIXEL_ID /
         VITE_GA4_MEASUREMENT_ID / VITE_CLARITY_PROJECT_ID. Do NOT hardcode tag
         <script>s here — that fires them before consent and bypasses the banner.
         PostHog (needsConsent:false) initialises from JS at app boot. -->

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
