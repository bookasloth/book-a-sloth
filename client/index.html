<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- INTERIM (fee-only) positioning: booking platform, no earnings/commission promise.
         Static site-wide default (scrapers don't run JS). Revert to the earnings-led
         wording on Razorpay Route go-live (a deploy re-bakes these). -->
    <title>Book A Sloth — the calm booking platform for India</title>
    <meta name="description" content="The calm booking &amp; scheduling platform for India's freelancers, coaches, tutors and studios. Your booking page, calendar sync, reminders and Google Meet — set up in minutes." />
    <meta name="theme-color" content="#FE5100" />
    <!-- NO static canonical / og:url here, on purpose. This file is the SPA
         fallback for EVERY route (via dist/spa-shell.html — see prerender.mjs):
         a hardcoded homepage canonical shipped `canonical=/` in the raw HTML of
         every non-prerendered page. Seo.jsx sets the correct per-route canonical
         at runtime; prerendered routes bake theirs at build time. -->

    <!-- Open Graph / social link previews. NOTE: static (scrapers don't run JS).
         Generic site-wide card only — no og:url, so an unrendered route never
         claims the homepage's identity. Per-page cards come from Seo.jsx
         (runtime) and the prerender (build time). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Book A Sloth" />
    <meta property="og:title" content="Book A Sloth — the calm booking platform for India" />
    <meta property="og:description" content="The calm booking &amp; scheduling platform for India. Your booking page, calendar sync, reminders and Google Meet — set up in minutes." />
    <meta property="og:image" content="https://bookasloth.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Book A Sloth — the calm booking platform for India" />
    <meta name="twitter:description" content="The calm booking &amp; scheduling platform for India — your booking page, calendar sync and reminders in minutes." />
    <meta name="twitter:image" content="https://bookasloth.com/og-image.png" />
    <!-- Preconnect to the four cross-origin hosts on the critical path, so the
         DNS + TLS handshake overlaps the HTML parse instead of stalling the
         first request to each. Lighthouse measured 660ms (PostHog) / 310ms (API)
         / 300ms (CDN) of LCP sitting in connection setup. Keep this list at four
         — more preconnects contend for bandwidth and stop paying for themselves.
         Values come from the build env (Vite substitutes %VITE_*% in this file);
         an unset var leaves an unparseable href the browser simply ignores. -->
    <link rel="preconnect" href="%VITE_POSTHOG_HOST%" crossorigin />
    <link rel="preconnect" href="%VITE_API_URL%" crossorigin />
    <link rel="preconnect" href="https://company-assets.bookasloth.in" crossorigin />
    <!-- Supabase Storage — host cover + profile photos, the LCP image on every
         /:username profile page. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />

    <!-- Self-hosted fonts (see src/styles/fonts.css). Preload only the two
         above-the-fold weights — heading (Plus Jakarta Sans) + body (Poppins 400) —
         so the hero gets them fastest; the rest load on demand via @font-face. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/plus-jakarta-sans-latin-var.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/poppins-latin-400.woff2" />
    <!-- Homepage hero (desktop LCP). Mobile uses a text-only hero, so this is
         media-gated to sm+ and costs mobile nothing. Keep in sync with HERO in
         src/components/home/images.js. -->
    <link rel="preload" as="image" media="(min-width: 640px)" fetchpriority="high"
          href="https://company-assets.bookasloth.in/images/banner/hero-book-a-sloth.png" />
    <!-- Razorpay Checkout is loaded on demand at checkout (src/utils/loadRazorpay.js),
         not here — it used to render-block every page including public marketing pages. -->

    <!-- Marketing tags (Meta Pixel, GA4, Microsoft Clarity) are loaded by the
         consent-gated analytics bus (src/services/analytics/) ONLY after the user
         grants marketing consent. IDs come from VITE_FB_PIXEL_ID /
         VITE_GA4_MEASUREMENT_ID / VITE_CLARITY_PROJECT_ID. Do NOT hardcode tag
         <script>s here — that fires them before consent and bypasses the banner.
         PostHog (needsConsent:false) initialises from JS at app boot. -->

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
